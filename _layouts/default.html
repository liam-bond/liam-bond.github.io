<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | escape }}{% else %}{{ site.tagline | escape }}{% endif %}">
  <link rel="preload" href="{{ '/assets/fonts/archivo-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <span>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</span>
      {% if site.github_username and site.github_username != "" %}
        <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      {% endif %}
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
